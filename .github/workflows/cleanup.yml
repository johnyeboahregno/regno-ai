name: Teardown developer preview

# Delete a developer's preview namespace when their PR is merged/closed,
# or manually via workflow_dispatch. Keeps the cluster from accumulating
# stale namespaces.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      slug:
        description: "Developer slug to tear down (namespace = dev-<slug>)"
        required: true

jobs:
  teardown:
    name: Delete preview namespace
    runs-on: [self-hosted, linux, k3s]
    steps:
      - name: Resolve namespace
        id: resolve
        shell: bash
        run: |
          if [ -n "${SLUG:-}" ]; then
            namespace="dev-$SLUG"
          elif [[ "$GITHUB_HEAD_REF" == dev-* ]]; then
            namespace="dev-${GITHUB_HEAD_REF#dev-}"
          elif [[ "$GITHUB_HEAD_REF" == developer/* ]]; then
            namespace="dev-${GITHUB_HEAD_REF#developer/}"
          else
            echo "not a developer preview branch — nothing to tear down" >&2
            echo "namespace=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
        env:
          SLUG: ${{ inputs.slug }}

      - name: Delete namespace
        if: steps.resolve.outputs.namespace != ''
        run: |
          kubectl delete namespace "${{ steps.resolve.outputs.namespace }}" --ignore-not-found
