name: Verify

# Reusable gate: install → type-check → build.
# Called by the CI, production-deploy and developer-deploy workflows so every
# path runs the exact same checks before anything is deployed.
on:
  workflow_call:

jobs:
  verify:
    name: Install, check & build
    runs-on: [self-hosted, linux, k3s]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check (web)
        run: npm run check -w @regno/web

      - name: Build all workspaces (type-checks packages + apps)
        run: npm run build
