name: Deploy (production)

# On every push to master/main: test + build, then build images, deploy to
# the k3s cluster (default namespace) and validate the deployed version.
# Rolls back automatically if validation fails.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml

  deploy:
    name: Build images & deploy
    needs: verify
    runs-on: [self-hosted, linux, k3s]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build, deploy & validate (namespace: default)"
        run: |
          bash scripts/k8s-deploy.sh \
            --namespace default --port 3000 \
            --image-repo "${{ secrets.DOCKERHUB_USERNAME }}/regnocr" \
            --tag "sha-${GITHUB_SHA:0:12}" \
            --push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show rollout result
        if: always()
        run: |
          kubectl -n default get pods
