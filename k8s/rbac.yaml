# RBAC for the web pod so it can spawn agent namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-spawner
rules:
  - apiGroups: [""]
    resources: [namespaces, secrets, pods, services, persistentvolumeclaims, pods/exec]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-spawner-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-spawner
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
